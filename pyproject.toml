[project]
name = "green-stove-agents"
version = "0.1.0"
description = "Shared Brain experiment for household energy coordination at a simulated solar cooking station"
requires-python = ">=3.12"
dependencies = [
  "pydantic>=2.7",
  "httpx>=0.27",
  "python-dotenv>=1.0",
  "rich>=13.7",
]

[project.optional-dependencies]
dev = ["pytest>=8"]

[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[tool.setuptools.packages.find]
include = ["greenstove*"]

[tool.pytest.ini_options]
testpaths = ["tests"]
pythonpath = ["."]
